spring:
  application:
    name: carro-service

  datasource:
    url: jdbc:mysql://localhost:3306/microservice?useSSL=false&serverTimezone=UTC
    username: root
    password: mysql

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8002

eureka:
  client:
    # colocamos true porque es un cliente
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka

  instance:
    hostname: localhost

